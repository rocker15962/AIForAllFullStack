name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Frontend (lint + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Lint
        run: npx eslint .

      - name: Type Check
        run: npx tsc --noEmit

      - name: Format Check
        run: npx prettier --check "src/**/*.{ts,tsx,json,css,md}"

      - name: Test with Coverage
        run: npx vitest run --coverage

  backend:
    name: Backend (vet + test + coverage)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Vet
        run: go vet ./...

      - name: Lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v2.11.4
          working-directory: backend

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Verify Swagger docs
        run: |
          swag init -g cmd/server/main.go -o docs/swagger
          git diff --exit-code docs/swagger/

      - name: Build
        run: go build ./...

      - name: Test with Coverage
        run: go test ./... -v -cover

  integration:
    name: Integration Tests (testcontainers)
    runs-on: ubuntu-latest
    needs: [backend]
    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: backend/go.sum

      - name: Integration Tests
        run: go test -tags integration ./internal/integration/ -v -count=1

  e2e:
    name: E2E Tests (Playwright)
    runs-on: ubuntu-latest
    needs: [frontend]
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install chromium --with-deps

      - name: Run E2E Tests
        run: npx playwright test

  docker:
    name: Docker Build Verification
    runs-on: ubuntu-latest
    needs: [frontend, backend, integration, e2e]

    steps:
      - uses: actions/checkout@v4

      - name: Build frontend image
        run: docker build -t aiforall-frontend --target production ./frontend

      - name: Build backend image
        run: docker build -t aiforall-backend --target production ./backend
