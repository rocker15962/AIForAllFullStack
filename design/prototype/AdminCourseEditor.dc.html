            </x-import>
          </sc-for>
        </div>
      </sc-if>
    </x-import>
  </main>

  <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.Dialog" open="{{ dlgOpen }}" title="{{ dlgTitle }}" on-close="{{ closeDlg }}" footer="{{ dlgFooter }}" hint-size="0px,0px">

      </x-import>
      <sc-if value="{{ dIsMC }}" hint-placeholder-val="{{ true }}">
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.FormField" label="選項（點選圓鈕標記正確答案）" size="sm" hint-size="100%,230px">
          <div style="display:flex;flex-direction:column;gap:10px">
            <sc-for list="{{ dOpts }}" as="o" hint-placeholder-count="4">
              <div style="display:flex;align-items:center;gap:10px">
                <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.Radio" checked="{{ o.checked }}" weight="{{ 1.5 }}" on-click="{{ o.mark }}" hint-size="18px,18px"></x-import>
                <div style="flex:1;min-width:0">
                  <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.Input" variant="outline" selected="{{ o.checked }}" value="{{ o.value }}" on-change="{{ o.change }}" placeholder="{{ o.placeholder }}" input-style="{{ optInputStyle }}" hint-size="100%,42px"></x-import>
                </div>
              </div>
            </sc-for>
          </div>
        </x-import>
      </sc-if>
      <sc-if value="{{ dIsSA }}" hint-placeholder-val="{{ false }}">
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.FormField" label="範例答案" size="sm" hint="AI 會依範例答案判定學員的回答" hint-size="100%,110px">
          <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.Textarea" variant="strong" rows="{{ 2 }}" value="{{ d.sample }}" on-change="{{ setDSample }}" placeholder="寫下一個標準答案…" hint-size="100%,66px"></x-import>
        </x-import>
      </sc-if>
      <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.FormField" label="解說（選填）" size="sm" hint-size="100%,90px">
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.Textarea" variant="strong" rows="{{ 2 }}" value="{{ d.expl }}" on-change="{{ setDExpl }}" placeholder="說明為什麼這是正確答案…" hint-size="100%,66px"></x-import>
      </x-import>
      <sc-if value="{{ dHasErr }}" hint-placeholder-val="{{ false }}">
        <p style="margin:0;font-size:14px;color:var(--danger-alt)">{{ d.err }}</p>
      </sc-if>
    </div>
  </x-import>
</div>
</x-dc>

    { type: 'mc', text: 'ChatGPT 給出錯誤回應時，你該怎麼做？', opts: ['放棄使用', '補充更多背景，或換個方式下指示', '接受錯誤的答案', '改問完全不同的問題'], correct: 1, expl: 'ChatGPT 回答錯誤時，補充更多資訊或換個方式提問，通常就能得到更好的結果。' },

  ];
  emptyDlg = { open: false, editing: null, type: 'mc', text: '', opts: ['', '', '', ''], correct: -1, expl: '', sample: '', err: null };

        E('Button', { loading: s.saving === 'publish', disabled: !!s.saving, onClick: () => save('publish') }, '發布')),
      f: s.f,

      setUrl: (e) => this.setF('url', e.target.value),
      setTool: (v) => this.setF('tool', v),
      setSkill: (v) => this.setF('skill', v),
      setLevel: (v) => this.setF('level', v),
      setCreator: (v) => this.setF('creator', v),
      setDuration: (e) => this.setF('duration', e.target.value),

      hasUrl: !!s.f.url.trim(), noUrl: !s.f.url.trim(),
      toolOpts: [{ value: 't1', label: 'ChatGPT' }, { value: 't2', label: 'Midjourney' }, { value: 't3', label: 'Cursor' }, { value: 't4', label: 'Claude' }, { value: 't5', label: 'Stable Diffusion' }],
      skillOpts: [{ value: 's1', label: '文案寫作' }, { value: 's2', label: '圖像生成' }, { value: 's3', label: '程式開發' }, { value: 's4', label: '資料分析' }, { value: 's5', label: '簡報製作' }],
      levelOpts: [{ value: 'beginner', label: '入門' }, { value: 'intermediate', label: '中級' }, { value: 'advanced', label: '進階' }],
      qMeta: '已新增 ' + s.qs.length + ' 題',
      addAction: E('Button', { variant: 'outline', leadingIcon: 'plus', style: { padding: '8px 12px' }, onClick: () => this.setState({ d: { ...this.emptyDlg, open: true } }) }, '新增題目'),
      noQuestions: s.qs.length === 0, hasQuestions: s.qs.length > 0,
      qs: s.qs.map((q, i) => ({
        n: i + 1, text: q.text,
        typeLabel: q.type === 'mc' ? '單選題' : '簡答題',
        tagTone: q.type === 'mc' ? 'accent-strong' : 'highlight',
        opts: q.type === 'mc' ? q.opts.map((o, k) => ({ text: L[k] + '. ' + o + (k === q.correct ? ' ✓' : ''), correct: k === q.correct, wrong: k !== q.correct })) : [],
        edit: () => this.openEdit(i),
        remove: () => this.setState((st) => ({ qs: st.qs.filter((_, k) => k !== i) })),
      })),
      dlgOpen: s.d.open,
      dlgTitle: s.d.editing !== null ? '編輯題目' : '新增題目',
      closeDlg: () => this.setState({ d: { ...this.emptyDlg } }),
      dlgFooter: h(React.Fragment, null,
        E('Button', { variant: 'outline', style: { padding: '10px 20px' }, onClick: () => this.setState({ d: { ...this.emptyDlg } }) }, '取消'),
        E('Button', { style: { padding: '10px 20px' }, onClick: () => this.saveQ() }, '儲存題目')),
      d: s.d,
      typeOpts: [{ value: 'mc', label: '單選題' }, { value: 'sa', label: '簡答題' }],
      setDType: (v) => this.setD({ type: v }),
      setDText: (e) => this.setD({ text: e.target.value }),
      setDExpl: (e) => this.setD({ expl: e.target.value }),
      dIsMC: s.d.type === 'mc', dIsSA: s.d.type === 'sa',
      setDSample: (e) => this.setD({ sample: e.target.value }),
      dHasErr: !!s.d.err,
      optInputStyle: { height: 42 },
      dOpts: s.d.opts.map((o, i) => ({
        value: o, checked: s.d.correct === i, placeholder: '選項 ' + L[i],
        mark: () => this.setD({ correct: i }),
        change: (e) => { const v = e.target.value; this.setState((st) => { const opts = [...st.d.opts]; opts[i] = v; return { d: { ...st.d, opts } }; }); },
      })),
    };
  }
}
</script>
</body>
</html>
