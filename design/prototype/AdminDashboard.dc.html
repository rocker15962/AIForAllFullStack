<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/tokens/fonts.css">
<link rel="stylesheet" href="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/tokens/palette.css">
<link rel="stylesheet" href="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/tokens/semantic.css">
<link rel="stylesheet" href="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/tokens/typography.css">
<link rel="stylesheet" href="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/tokens/spacing.css">
<link rel="stylesheet" href="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/tokens/base.css">
<link rel="stylesheet" href="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/styles.css">
<script src="_ds/ai-for-all-neutral-ds-acd6b10e-70d1-4e99-a0bd-f103ea220046/_ds_bundle.js"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;600;700;800&display=swap">
<style>:root{--font-sans:'DM Sans','Noto Sans TC',ui-sans-serif,system-ui,sans-serif}body{margin:0;background:#fff}a{color:var(--accent-link);text-decoration:none}a:hover{color:var(--accent-hover)}</style>
</helmet>
<div lang="zh-Hant-TW" data-screen-label="Admin Dashboard" class="{{ themeClass }}" style="min-height:100vh;background:var(--surface-page);font-family:var(--font-sans)">
  <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.TopNav" brand="{{ brand }}" links="{{ navLinks }}" active-id="dashboard" on-navigate="{{ onNav }}" right="{{ navRight }}" hint-size="100%,56px"></x-import>

  <sc-if value="{{ denied }}" hint-placeholder-val="{{ false }}">
    <div style="min-height:calc(100vh - 56px);display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;color:var(--text-subtle)">
      <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.Icon" name="shield-alert" size="{{ 48 }}" hint-size="48px,48px"></x-import>
      <h1 style="margin:16px 0 0;font-size:20px;line-height:28px;font-weight:700;color:var(--text-strong)">需要管理員權限</h1>
      <p style="margin:8px 0 0;font-size:14px;color:var(--text-muted)">你必須是管理員才能查看此頁面。</p>
    </div>
  </sc-if>

  <sc-if value="{{ isAdmin }}" hint-placeholder-val="{{ true }}">
    <main style="max-width:1280px;margin:0 auto;padding:32px 24px;box-sizing:border-box">
      <div style="margin-bottom:32px">
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.PageHeader" title="儀表板" subtitle="平台數據總覽" hint-size="100%,68px"></x-import>
      </div>
      <div style="display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-bottom:32px">
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.StatCard" icon="users" label="總用戶數" value="1,284" trend="{{ trendUsers }}" hint-size="100%,86px"></x-import>
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.StatCard" icon="book-open" tone="highlight" label="課程數" value="8" hint-size="100%,86px"></x-import>
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.StatCard" icon="circle-check-big" tone="success" label="完課次數" value="3,412" trend="{{ trendDone }}" hint-size="100%,86px"></x-import>
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.StatCard" icon="activity" tone="violet" label="活躍用戶" value="412" trend="{{ trendActive }}" hint-size="100%,86px"></x-import>
      </div>
      <div style="display:grid;grid-template-columns:minmax(0,7fr) minmax(0,3fr);gap:24px;margin-bottom:32px;align-items:start">
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.TrendChart" title="用戶趨勢" data="{{ trend }}" series="{{ series }}" summary="{{ summary }}" hint-size="100%,440px"></x-import>
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.RankedList" title="熱門課程" items="{{ popular }}" hint-size="100%,330px"></x-import>
      </div>
      <div style="display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px">
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.ActionCard" icon="book-open" title="管理課程" description="新增、編輯或移除課程" on-click="{{ goCourses }}" hint-size="100%,82px"></x-import>
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.ActionCard" icon="users" tone="highlight" title="管理用戶" description="查看並管理用戶帳號" on-click="{{ goUsers }}" hint-size="100%,82px"></x-import>
        <x-import component-from-global-scope="AIForAllNeutralDS_acd6b1.ActionCard" icon="folder-open" tone="violet" title="管理分類" description="整理工具與技能分類" on-click="{{ goCategories }}" hint-size="100%,82px"></x-import>
      </div>
    </main>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;isAdmin&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;},&quot;dark&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:false,&quot;tsType&quot;:&quot;boolean&quot;}}">
class Component extends DCLogic {
  mp() { const o = {}; const q = this.props || {}; Object.keys(q).forEach((k) => { if (q[k] !== undefined) o[k] = q[k]; }); new URLSearchParams(window.location.search).forEach((v, k) => { o[k] = v === '1' ? true : v === '0' ? false : v; }); return o; }
  qs() { const u = new URLSearchParams(window.location.search); const o = new URLSearchParams(); ['signedIn', 'isAdmin', 'dark', 'showThumbnails'].forEach((k) => { if (u.has(k)) o.set(k, u.get(k)); }); const s = o.toString(); return s ? '?' + s : ''; }
  componentDidMount() { this._t = setInterval(() => { if (window.AIForAllNeutralDS_acd6b1) { clearInterval(this._t); this.forceUpdate(); } }, 60); }
  componentWillUnmount() { clearInterval(this._t); }
  buildTrend() {
    const out = [];
    for (let i = 0; i < 30; i++) {
      const dt = new Date(2026, 9, 6 + i);
      const wk = Math.sin(i * 0.9);
      const a = Math.round((i < 23 ? 250 + i * 8 : (250 + i * 8) * 0.9) + 16 * wk);
      const b = Math.max(4, Math.round(10 + i * 1.0 + 4 * wk));
      out.push({ x: (dt.getMonth() + 1) + '/' + dt.getDate(), a, b });
    }
    return out;
  }
  renderVals() {
    const D = window.AIForAllNeutralDS_acd6b1 || {};
    const h = React.createElement;
    const E = (n, p, ...c) => (D[n] ? h(D[n], p, ...c) : null);
    const go = (f) => () => { window.location.href = f + this.qs(); };
    const p = this.mp();
    const isAdmin = p.isAdmin ?? true;
    const trend = this.buildTrend();
    const routes = { dashboard: 'AdminDashboard.dc.html', courses: 'AdminCourses.dc.html', users: 'AdminUsers.dc.html', categories: 'AdminCategories.dc.html' };
    return {
      themeClass: p.dark ? 'dark' : '',
      brand: E('Wordmark', { accent: 'AI', text: 'for All', onClick: go('Landing.dc.html') }),
      navLinks: [{ id: 'dashboard', label: '儀表板' }, { id: 'courses', label: '課程' }, { id: 'users', label: '用戶' }, { id: 'categories', label: '分類' }],
      onNav: (id) => { window.location.href = routes[id] + this.qs(); },
      navRight: E('UserMenu', { name: isAdmin ? '系統管理員' : '陳怡君', email: isAdmin ? 'admin@example.com' : 'alice@example.com', items: [{ label: '我的學習', onClick: go('MyLearning.dc.html') }, { label: '個人資料', onClick: go('Profile.dc.html') }], onSignOut: go('Login.dc.html'), signOutLabel: '登出' }),
      isAdmin, denied: !isAdmin,
      trendUsers: { value: 25, direction: 'up', label: '比上週' },
      trendDone: { value: 12, direction: 'up', label: '比上週' },
      trendActive: { value: 8, direction: 'down', label: '比上週' },
      trend,
      series: [{ key: 'a', label: '活躍用戶', color: 'var(--chart-1)' }, { key: 'b', label: '新註冊', color: 'var(--chart-2)' }],
      summary: [
        { label: '本週新用戶', value: trend.slice(-7).reduce((n, d) => n + d.b, 0) },
        { label: '平均活躍用戶', value: Math.round(trend.reduce((n, d) => n + d.a, 0) / trend.length) },
      ],
      popular: [
        { id: 'c1', label: 'ChatGPT 文案寫作入門：從零開始學 AI 寫作', value: 812 },
        { id: 'c3', label: 'Cursor AI 開發：用 AI 加速寫程式', value: 644 },
        { id: 'c2', label: 'Midjourney 繪圖技巧：創作你的 AI 藝術作品', value: 503 },
        { id: 'c4', label: 'ChatGPT 進階：打造自動化工作流程', value: 441 },
        { id: 'c5', label: 'AI 資料分析：用 Claude 處理資料', value: 387 },
      ],
      goCourses: go(routes.courses), goUsers: go(routes.users), goCategories: go(routes.categories),
    };
  }
}
</script>
</body>
</html>
